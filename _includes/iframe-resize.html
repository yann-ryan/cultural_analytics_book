<script>
// Auto-resize exercise iframes to match their content height, so the
// iframe never shows its own inner scrollbar - only the book page scrolls.
// Works because the book and the exercises site are same-origin
// (both under yann-ryan.github.io), so we can read the iframe's document.
(function () {
  function resizeFrame(frame) {
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      var height = Math.max(
        doc.documentElement.scrollHeight,
        doc.body ? doc.body.scrollHeight : 0
      );
      if (height && height > 0) {
        frame.style.height = height + "px";
      }
    } catch (e) {
      // Cross-origin or not-yet-ready: leave the fallback height in place.
    }
  }

  function watchFrame(frame) {
    resizeFrame(frame);

    var doc = null;
    try {
      doc = frame.contentDocument || frame.contentWindow.document;
    } catch (e) {
      return;
    }
    if (!doc) return;

    // Exercise content (webR loading, gradethis feedback appearing/collapsing)
    // changes height after load, so keep watching rather than resizing once.
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function () {
        resizeFrame(frame);
      });
      ro.observe(doc.documentElement);
      if (doc.body) ro.observe(doc.body);
    } else {
      var tries = 0;
      var interval = setInterval(function () {
        resizeFrame(frame);
        tries++;
        if (tries > 60) clearInterval(interval); // ~30s of polling
      }, 500);
    }
  }

  function init() {
    var frames = document.querySelectorAll("iframe.exercise-frame");
    frames.forEach(function (frame) {
      // Always wait for a real "load" event rather than trusting an
      // already-"complete" contentDocument: with loading="lazy" the iframe
      // starts out pointed at about:blank, which reports readyState
      // "complete" immediately even though the real content hasn't loaded
      // yet - trusting that would bind the observer to the blank document
      // and miss the actual page entirely.
      frame.addEventListener("load", function () {
        watchFrame(frame);
      });
      // Belt-and-braces: if the load event already fired before this
      // listener was attached (e.g. a cached, non-lazy frame), resize once
      // immediately too.
      resizeFrame(frame);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
